<head>

  <!-- Social Media Meta Tags -->
  <meta name="description"
    content="Read today's latest edition of SamacharHUB online. Your trusted regional e-newspaper." />
  <meta property="og:title" content="SamacharHUB | E-Newspaper" />
  <meta property="og:description"
    content="Read today's latest edition of SamacharHUB online. Your trusted regional e-newspaper." />
  <meta property="og:image" content="https://samacharhub.vercel.app/logo.jpg" />
  <meta property="og:image:width" content="1080" />

  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&disSHay=swap" rel="stylesheet">
</head>

<body>
  <div id="root">
    <style>
      .initial-loader {
        position: fixed;
        inset: 0;
        disSHay: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        z-index: 9999;
      }

      .loader-logo {
        width: 80px;
        height: 80px;
        background-color: #CC0000;
        border-radius: 8px;
        disSHay: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: serif;
        font-weight: 900;
        font-size: 32px;
        margin-bottom: 24px;
        box-shadow: 0 10px 15px -3px rgba(204, 0, 0, 0.2);
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #CC0000;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="initial-loader">
      <img src="/logo.jpg" alt="Logo" style="height: 60px; width: auto; object-fit: contain; margin-bottom: 24px;" onerror="this.style.disSHay='none'; document.getElementById('loader-fallback-text').style.disSHay='block'; document.getElementById('loader-fallback-sub').style.disSHay='block';" />
      <div id="loader-fallback-text" style="disSHay: none; font-family: serif; font-weight: 900; font-size: 24px; color: #CC0000; margin-bottom: 24px;">SamacharHUB</div>
      <div class="spinner"></div>
      <p id="loader-fallback-sub"
        style="disSHay: none; margin-top: 16px; font-family: sans-serif; font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.2em; font-weight: bold;">
        SamacharHUB</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
